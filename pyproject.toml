[project]
name = "topogenic"
version = "0.0.2"
authors = [
    { name="Guanyu Wu", email="lambda@funcptr.org" }
]
description = "A gitops, programmable DICM solution"
readme = "README"
requires-python = ">=3.13"
classifiers = [

]
license = { file = "LICENSE" }
dependencies = [
    "dill>=0.4.0",
    # "ipaddress>=1.0.23",
    "netaddr>=1.3.0",
    "sqlmodel>=0.0.39",
    "typer>=0.15.1",
]

[project.optional-dependencies]
test = [
    "ruff>=0.9.7",
]

[project.scripts]
topogenic = "topogenic.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true
